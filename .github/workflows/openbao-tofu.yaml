name: Openbao Opentofu Run

on:
  push:
    branches:
      - 'main'
    paths:
      - 'openbao/tofu/**'
      - '.github/workflows/openbao-tofu.yaml'
  workflow_dispatch:


jobs:
  manage-openbao:
    runs-on: [self-hosted, Windows, X64]  # Targets your self-hosted runner pool
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass {0}
    permissions:
      id-token: write
      contents: read
    steps:
      # Clone only the specific path from that branch (Sparse Checkout)
      - name: Checkout specific path
        uses: actions/checkout@v4
        with:
          ref: 'main'
          sparse-checkout: |
            openbao
          sparse-checkout-cone-mode: true


      - name: Get GitHub OIDC token
        id: github-oidc
        shell: powershell
        run: |
          $response = Invoke-RestMethod `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" `
            -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"; Accept = "application/json" }
          $token = $response.value
          Write-Output "::add-mask::$token"
          "oidc_token=$token" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
 
      - name: Authenticate with OpenBao
        id: bao-auth
        shell: powershell
        run: |
          $body = @{ role = "opentofu-manager"; jwt = "${{ steps.github-oidc.outputs.oidc_token }}" } | ConvertTo-Json
          $response = Invoke-RestMethod `
            -Uri "http://localhost:8200/v1/auth/jwt/login" `
            -Method POST `
            -ContentType "application/json" `
            -Body $body
          $baoToken = $response.auth.client_token
          Write-Output "::add-mask::$baoToken"
          "VAULT_TOKEN=$baoToken" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # Run your Windows command inside the target folder
      - name: Run command in path
        working-directory: .\openbao\tofu
        env:
          TF_VAR_pwd_postgres_01: ${{ secrets.TF_VAR_PWD_POSTGRES_01 }}
          TF_VAR_pwd_postgres_02: ${{ secrets.TF_VAR_PWD_POSTGRES_02 }}
          TF_VAR_vinay_dg_password: ${{ secrets.TF_VAR_VINAY_DG_PASSWORD }}
          TF_VAR_vinay_password: ${{ secrets.TF_VAR_VINAY_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAULT_ADDR: "http://localhost:8200"
        run: |
          Write-Output "Currently running in: $(Get-Location)"
          tofu init
          tofu plan
          tofu apply
      - name: Post-run workspace cleanup
        if: always()
        run: |
          Write-Output "Cleaning up self-hosted workspace..."
          Remove-Item -Path * -Recurse -Force -ErrorAction SilentlyContinue
