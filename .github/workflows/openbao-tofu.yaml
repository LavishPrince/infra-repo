name: Openbao Opentofu Run

on:
  push:
    branches:
      - 'main'
    paths:
      - 'openbao/tofu/**'
      - '.github/workflows/openbao-tofu.yaml'
  workflow_dispatch:


jobs:
  manage-openbao:
    runs-on: [self-hosted, Windows, X64]  # Targets your self-hosted runner pool
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass {0}
    permissions:
      id-token: write
      contents: read
    steps:
      # Clone only the specific path from that branch (Sparse Checkout)
      - name: Checkout specific path
        uses: actions/checkout@v4
        with:
          ref: 'main'
          sparse-checkout: |
            openbao
          sparse-checkout-cone-mode: true


      - name: Fetch OpenBao Token
        id: bao-auth
        env:
          # Explicitly map GitHub's internal OIDC variables so PowerShell can see them
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}
          BAO_ADDR: "http://localhost:8200"
          BAO_NAMESPACE: "quation-team" # Ensure this matches your OpenBao setup
          BAO_ROLE: "opentofu-manager"
        run: |
          $ActionsToken = $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if ([string]::IsNullOrEmpty($ActionsToken)) {
              Write-Error "CRITICAL: GitHub ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty. Verify that 'permissions: id-token: write' is set at the job or workflow level."
              exit 1
          }

          # 3. Construct headers explicitly requiring X-Vault-Request and target Namespace
          $Headers = @{
              "X-Vault-Request"   = "true"
              "X-Vault-Namespace" = "${{ env:BAO_NAMESPACE }}"
          }

          # 4. Construct Payload matching the OpenTofu Role configuration
          $Body = @{
              role = "${{ env:BAO_ROLE }}"
              jwt  = $ActionsToken
          } | ConvertTo-Json

          # 5. Make the API Call to the JWT Auth Backend Login Route
          $LoginUrl = "${{ env:BAO_ADDR }}/v1/auth/github/login"
          Write-Host "Attempting authentication against OpenBao endpoint: $LoginUrl"

          try {
              $Response = Invoke-RestMethod -Uri $LoginUrl -Method Post -Headers $Headers -Body $Body -ContentType "application/json"

              if ($null -eq $Response -or $null -eq $Response.auth -or [string]::IsNullOrEmpty($Response.auth.client_token)) {
                  Write-Error "OpenBao authenticated successfully but returned an invalid token structure."
                  exit 1
              }

              # 6. Extract token and mask it securely in GitHub Actions logging
              $BaoToken = $Response.auth.client_token
              Write-Output "::add-mask::$BaoToken"

              # Set environmental variable for subsequent pipeline stages
              echo "BAO_TOKEN=$BaoToken" >> $env:GITHUB_ENV
              Write-Host "Successfully retrieved and registered OpenBao client token."

          } catch {
              Write-Error "Failed to reach or process login request. Error Details: $_"
              if ($_.Exception.Response) {
                  $Reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                  $ErrorBody = $Reader.ReadToEnd()
                  Write-Error "Server returned error body: $ErrorBody"
              }
              exit 1
          }
      # Run your Windows command inside the target folder
      - name: Run command in path
        working-directory: .\openbao\tofu
        env:
          TF_VAR_pwd_postgres_01: ${{ secrets.TF_VAR_PWD_POSTGRES_01 }}
          TF_VAR_pwd_postgres_02: ${{ secrets.TF_VAR_PWD_POSTGRES_02 }}
          TF_VAR_vinay_dg_password: ${{ secrets.TF_VAR_VINAY_DG_PASSWORD }}
          TF_VAR_vinay_password: ${{ secrets.TF_VAR_VINAY_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAULT_ADDR: "http://localhost:8200"
        run: |
          Write-Output "Currently running in: $(Get-Location)"
          tofu init
          tofu plan
          tofu apply
      - name: Post-run workspace cleanup
        if: always()
        run: |
          Write-Output "Cleaning up self-hosted workspace..."
          Remove-Item -Path * -Recurse -Force -ErrorAction SilentlyContinue
