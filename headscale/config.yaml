server_url: https://headscale.quation.co.in
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

# Using /var/lib/headscale which will map to our named Docker Volume
database:
  type: sqlite3
  sqlite:
    path: /var/lib/headscale/db.sqlite

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# In newer versions, the main private key path is nested under 'derp' or omitted if generated automatically
# explicitly providing the legacy fallback key structure here to guarantee initialization path string matching:
private_key_path: /var/lib/headscale/private.key

prefixes:
  v4: 100.64.0.0/10

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
  urls:
    - https://tailscale.com

dns:
  magic_dns: false
  override_local_dns: false

tls_cert_path: ""
tls_key_path: ""
log_level: info
