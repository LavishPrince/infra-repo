server_url: https://headscale.quation.co.in
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

# Using /var/lib/headscale which will map to our named Docker Volume
db_type: sqlite3
db_path: /var/lib/headscale/db.sqlite

# Security & Keys paths mapped inside the volume
private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

ip_prefixes:
  - 100.64.0.0/10

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
  urls:
    - https://tailscale.com

tls_cert_path: ""
tls_key_path: ""
log_level: info
