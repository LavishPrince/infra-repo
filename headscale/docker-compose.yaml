services:
  headscale:
    build:
      context: .
      dockerfile: headscale.Dockerfile
    container_name: headscale
    restart: always
    ports:
      - "8100:8080"
      - "3478:3478/udp"
    volumes:
      - headscale_data:/var/lib/headscale

  headplane:
    build:
      context: .
      dockerfile: headplane.Dockerfile
    container_name: headplane
    restart: always
    ports:
      - "3010:3000"
    environment:
      - COOKIE_SECRET=${COOKIE_SECRET}
      - HEADPLANE_CONFIG_DIR=/etc/headplane
    volumes:
      - headplane_data:/app/config
    depends_on:
      - headscale

volumes:
  headscale_data:
    name: headscale_data
  headplane_data:
    name: headplane_data
