services:
  headscale:
    build:
      context: .
      dockerfile: headscale.Dockerfile
    container_name: headscale
    restart: always
    ports:
      - "127.0.0.1:8100:8080"
      - "3478:3478/udp"
    volumes:
      - headscale_data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  headplane:
    build:
      context: .
      dockerfile: headplane.Dockerfile
    container_name: headplane
    restart: always
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - HEADPLANE_CONFIG_PATH=/etc/headplane/config.yaml
      - HEADPLANE_SERVER__COOKIE_SECRET=${COOKIE_SECRET}
    volumes:
      - headplane_data:/var/lib/headplane
    depends_on:
      headscale:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  headscale_data:
    name: headscale_data
  headplane_data:
    name: headplane_data
