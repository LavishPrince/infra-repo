services:
  headscale:
    build:
      context: .
      dockerfile: headscale.Dockerfile
    container_name: headscale
    restart: always
    ports:
      - "8100:8080"
      - "3478:3478/udp"
    volumes:
      - headscale_data:/var/lib/headscale

  headplane:
    build:
      context: .
      dockerfile: headplane.Dockerfile
    container_name: headplane
    restart: always
    ports:
      - "3010:3000"
    environment:
      - HEADPLANE_CONFIG_FILE=/etc/headplane/config.yaml
      - HEADPLANE_LOAD_ENV_OVERRIDES=true
      - HEADPLANE_SERVER__COOKIE_SECRET=${COOKIE_SECRET}
    volumes:
      - headplane_data:/var/lib/headplane
    depends_on:
      - headscale

volumes:
  headscale_data:
    name: headscale_data
  headplane_data:
    name: headplane_data
