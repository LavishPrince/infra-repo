services:
  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"  # UI and HTTP Ingestion (including OpenTelemetry OTLP/HTTP)
      - "5081:5081"  # OpenTelemetry OTLP/gRPC Ingestion
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=vinay.dg@quation.in
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
    volumes:
      - openobserve_data:/data
  vector_collector:
    build:
      context: .
      dockerfile: vector.Dockerfile
    container_name: vector_collector
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OPENOBSERVE_TOKEN=${OPENOBSERVE_TOKEN}
volumes:
  openobserve_data:
    external: true