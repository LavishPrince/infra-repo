sources:
  docker_logs:
    type: docker_logs
    docker_host: "unix:///var/run/docker.sock"
    exclude_containers:
      - vector_collector

sinks:
  openobserve:
    type: http
    inputs:
      - docker_logs
    uri: http://openobserve:5080/api/default/_json
    # Basic auth configuration nested under request
    request:
      auth:
        strategy: basic
        user: "vinay.dg@quation.in"
        password: "${OPENOBSERVE_TOKEN}"
    encoding:
      codec: json
