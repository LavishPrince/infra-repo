sources:
  docker_logs:
    type: docker_logs
    # Crucial for Docker Desktop: forces API streaming instead of file tailing
    # Exclude Vector itself so it doesn't create an infinite logging loop
    docker_host: "unix:///var/run/docker.sock" 
    exclude_containers:
      - vector_collector

sinks:
  openobserve:
    type: http
    inputs:
      - docker_logs
    uri: http://openobserve:5080/api/default/_json
    headers:
      Authorization: "Bearer ${OPENOBSERVE_TOKEN}"
    encoding:
      codec: json
